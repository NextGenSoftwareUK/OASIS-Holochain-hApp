[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
resolver = "2"
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]

[workspace.dependencies]
hdi = "=0.8.0"
hdk = "=0.7.0"
serde = "1"
serde_json = "1"
holochain_serialized_bytes = "=0.0.57"
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace.dependencies.oasis]
path = "dnas/oasis/zomes/coordinator/oasis"

[workspace.dependencies.oasis_integrity]
path = "dnas/oasis/zomes/integrity/oasis"
